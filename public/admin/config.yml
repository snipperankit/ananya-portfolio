                  - { name: alt, label: "Alt text", widget: "string", required: false }
                  - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
