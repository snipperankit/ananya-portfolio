local_backend: true

backend:
  name: github
  repo: snipperankit/ananya-portfolio
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { name: title, label: "Title", widget: "string", required: true }
      - { name: date, label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: draft, label: "Hide (draft)", widget: "boolean", default: false, required: false }
      - { name: eyebrow, label: "Eyebrow", widget: "string", required: false }
      - { name: font, label: "Font", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
      - name: blocks
        label: "Body"
        widget: "list"
        types:
          - label: "Heading"
            name: "heading"
            fields:
              - { name: level, label: "Level", widget: "select", options: [1,2,3], default: 1 }
              - { name: text, label: "Text", widget: "string" }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Text"
            name: "text"
            fields:
              - { name: text, label: "Text (Markdown supported: **bold**, *italic*)", widget: "text", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Article"
            name: "article"
            fields:
              - { name: title, label: "Title", widget: "string", required: false }
              - { name: excerpt, label: "Excerpt", widget: "text", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Image"
            name: "image"
            fields:
              - { name: image, label: "Image", widget: "image" }
              - { name: caption, label: "Caption", widget: "string", required: false }
              - { name: alt, label: "Alt text", widget: "string", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Gallery"
            name: "gallery"
            fields:
              - name: images
                label: "Images"
                widget: "list"
                fields:
                  - { name: url, label: "Image", widget: "image" }
                  - { name: alt, label: "Alt text", widget: "string", required: false }
              - { name: caption, label: "Caption", widget: "string", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Video"
            name: "video"
            fields:
              - { name: url, label: "YouTube/Vimeo URL", widget: "string" }
              - { name: caption, label: "Caption", widget: "string", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Chart"
            name: "chart"
            fields:
              - { name: chartType, label: "Type", widget: "select", options: ["bar","line","pie","stat"] }
              - { name: title, label: "Title", widget: "string", required: false }
              - name: data
                label: "Data"
                widget: "list"
                fields:
                  - { name: label, label: "Label", widget: "string" }
                  - { name: value, label: "Value", widget: "number" }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Quote"
            name: "quote"
            fields:
              - { name: text, label: "Quote text", widget: "text" }
              - { name: attribution, label: "Attribution", widget: "string", required: false }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "CTA"
            name: "cta"
            fields:
              - { name: label, label: "Label", widget: "string" }
              - { name: href, label: "Href", widget: "string" }
              - { name: font, label: "Font (optional)", widget: "select", options: ["Newsreader","Space Grotesk","Libre Franklin","Lora","Playfair Display","IBM Plex Mono"], required: false }
              - { name: align, label: "Align", widget: "select", options: ["left","center","right"], required: false }

          - label: "Divider"
            name: "divider"
            fields:
              - { name: divider, label: "Divider", widget: "hidden", default: true }

  - name: "about"
